# Local Postgres and Redis for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spotflow
      POSTGRES_PASSWORD: spotflow
      POSTGRES_DB: spotflow_games
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
      - "5173:5173"
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres@host.docker.internal:5432/spotflow_games
      REDIS_URL: redis://redis:6379
      COOKIE_SECRET: dev-only-cookie-secret-change-me-please-000
      NODE_ENV: development
volumes:
  pgdata:
